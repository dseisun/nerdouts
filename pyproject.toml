[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nerdouts"
version = "0.1.0"
description = "A workout management system"
readme = "README.md"
requires-python = ">=3.8.1"
license = {text = "Creative Commons Attribution-Noncommercial-Share Alike license"}
authors = [
    {name = "Daniel Seisun"}
]
urls = {Homepage = "https://github.com/dseisun/nerdouts"}
dependencies = [
    "pyyaml>=4.2b1",
    "SQLAlchemy",
    "fastapi[standard]>=0.104.1",
    "uvicorn>=0.24.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.6",
    "websockets>=13.1",
    "textual>=0.73.0",
    "psycopg2>=2.9.10",
    "requests>=2.32.3",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
linux = [
    "dbus-python>=1.3.0"
]
mysql = [
    "mysqlclient>=2.2.0"
]

postgres = [
    "psycopg2>=2.9.9"
]

[tool.setuptools]
packages = ["nerdouts"]

[tool.setuptools.package-data]
nerdouts = ["*"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
]

[project.scripts]
nerdouts = "nerdouts.run_workout:main"

# Code Quality Tool Configuration

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Ignore unused imports in __init__.py

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | vendor
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

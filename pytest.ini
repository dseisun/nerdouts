[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = nerdouts

# Output options
addopts =
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Shorter traceback format
    --tb=short
    # Strict markers (fail if unknown marker used)
    --strict-markers
    # Strict config (fail on config warnings)
    --strict-config
    # Show warnings
    -W default

# Coverage options (when using --cov)
[coverage:run]
source = nerdouts
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */vendor/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov
